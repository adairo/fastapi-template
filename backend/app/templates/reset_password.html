{% extends "base.html" %}
{% block title %}Reset password - {{ project_name }}{% endblock %}
{% block content %}
<article>
  <header><h1>Reset password</h1></header>
  {% if error %}
  <p class="error-text">{{ error }}</p>
  {% else %}
  <form method="post" action="/reset-password">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="token" value="{{ token }}">
    <label>
      New password
      <input type="password" name="password" required autocomplete="new-password">
      {% if errors and errors.password %}<small class="error-text">{{ errors.password }}</small>{% endif %}
    </label>
    <label>
      Confirm password
      <input type="password" name="confirm_password" required autocomplete="new-password">
      {% if errors and errors.confirm_password %}<small class="error-text">{{ errors.confirm_password }}</small>{% endif %}
    </label>
    <button type="submit">Reset password</button>
  </form>
  {% endif %}
  <footer>
    <small><a href="/login">Back to log in</a></small>
  </footer>
</article>
{% endblock %}
