{% extends "base.html" %}
{% block title %}Log in - {{ project_name }}{% endblock %}
{% block content %}
<article>
  <header><h1>Log in</h1></header>
  {% if flash %}
  <article class="{{ flash.category }}">{{ flash.message }}</article>
  {% endif %}
  {% if error %}
  <p class="error-text">{{ error }}</p>
  {% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>
      Email
      <input type="email" name="email" value="{{ email or '' }}" required autocomplete="email">
    </label>
    <label>
      Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button type="submit">Log in</button>
  </form>
  <footer>
    <small><a href="/signup">Sign up</a> · <a href="/recover-password">Forgot password?</a></small>
  </footer>
</article>
{% endblock %}
